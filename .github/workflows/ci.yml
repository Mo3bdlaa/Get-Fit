name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run verify` is the fast loop the Stop hook runs; CI adds the browser
      # test on top of it via verify:full.
      - run: npx playwright install --with-deps chromium

      - run: npm run verify:full
